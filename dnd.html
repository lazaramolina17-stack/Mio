<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>D&D 5e Toolkit</title>
<script src="dnd-data.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0e0c;
  --bg2:#1a1815;
  --bg3:#252220;
  --border:#3d3530;
  --text:#d4cdc0;
  --text-dim:#8a8075;
  --accent:#c8a44e;
  --accent2:#a83220;
  --hp-red:#96281b;
  --mana-blue:#2d5a7b;
  --gold-glow:rgba(200,164,78,0.15);
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Courier New',Courier,monospace;
  font-size:14px;
  line-height:1.5;
  display:flex;
  flex-direction:column;
}
#app{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  max-width:600px;
  margin:0 auto;
  width:100%;
}
#header{
  background:var(--bg2);
  border-bottom:2px solid var(--border);
  padding:10px 16px;
  text-align:center;
  flex-shrink:0;
}
#header h1{
  color:var(--accent);
  font-size:18px;
  letter-spacing:3px;
  text-transform:uppercase;
  text-shadow:0 0 12px var(--gold-glow);
}
#header span{color:var(--text-dim);font-size:11px;display:block;margin-top:2px}
#content{
  flex:1;
  overflow-y:auto;
  padding:12px;
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}
#content::-webkit-scrollbar{width:5px}
#content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.tab-content{display:none}
.tab-content.active{display:block}
/* ---- TABS ---- */
#tab-bar{
  display:flex;
  flex-shrink:0;
  background:var(--bg2);
  border-top:2px solid var(--border);
}
.tab-btn{
  flex:1;
  background:transparent;
  border:none;
  color:var(--text-dim);
  font-family:inherit;
  font-size:11px;
  padding:10px 4px 8px;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:1px;
  transition:all .15s;
  border-top:2px solid transparent;
  margin-top:-2px;
}
.tab-btn.active{
  color:var(--accent);
  border-top-color:var(--accent);
  background:var(--bg3);
}
/* ---- FORM ELEMENTS ---- */
label{display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
select,input,textarea{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 10px;
  border-radius:4px;
  font-family:inherit;
  font-size:13px;
  outline:none;
  transition:border-color .15s;
}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
select option{background:var(--bg2);color:var(--text)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.form-group{margin-bottom:10px}
.form-row{display:flex;gap:8px}
.form-row>*{flex:1}
.btn{
  background:var(--bg3);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 16px;
  border-radius:4px;
  cursor:pointer;
  font-family:inherit;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:1px;
  transition:all .15s;
}
.btn:hover,.btn:focus{border-color:var(--accent);color:var(--accent);background:var(--bg2)}
.btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:bold}
.btn-primary:hover{background:#b8942e;border-color:#b8942e;color:var(--bg)}
.btn-danger{background:var(--hp-red);border-color:var(--hp-red);color:#fff}
.btn-danger:hover{background:#7a1f15;border-color:#7a1f15}
.btn-sm{padding:4px 10px;font-size:11px}
/* ---- SHEET ---- */
.sheet{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:14px;
  margin-bottom:12px;
}
.sheet h2{
  color:var(--accent);
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:2px;
  border-bottom:1px solid var(--border);
  padding-bottom:6px;
  margin-bottom:10px;
}
.stat-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
  margin-bottom:10px;
}
.stat-card{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:4px;
  text-align:center;
  padding:6px 2px;
  cursor:pointer;
  transition:all .15s;
}
.stat-card.selected{border-color:var(--accent);box-shadow:0 0 8px var(--gold-glow)}
.stat-card .stat-label{font-size:9px;color:var(--text-dim);text-transform:uppercase}
.stat-card .stat-value{font-size:18px;font-weight:bold;color:var(--accent)}
.stat-card .stat-mod{font-size:12px;color:var(--text)}
/* ---- DICE ---- */
.dice-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:12px;
}
.dice-btn{
  aspect-ratio:1;
  background:var(--bg3);
  border:2px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transition:all .15s;
  font-family:inherit;
}
.dice-btn:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.05)}
.dice-btn .label{font-size:10px;color:var(--text-dim);font-weight:normal;margin-top:2px}
.dice-result{
  text-align:center;
  padding:20px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:10px;
  min-height:80px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.dice-result .number{
  font-size:52px;
  font-weight:bold;
  color:var(--accent);
  text-shadow:0 0 20px var(--gold-glow);
  transition:all .3s;
  animation:none;
}
.dice-result .number.roll-anim{animation:dicePop .35s ease-out}
@keyframes dicePop{
  0%{transform:scale(0.3);opacity:0}
  50%{transform:scale(1.2)}
  100%{transform:scale(1);opacity:1}
}
.dice-result .detail{font-size:12px;color:var(--text-dim);margin-top:4px}
.history{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:10px;
  max-height:180px;
  overflow-y:auto;
}
.history-item{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  border-bottom:1px solid var(--bg3);
  font-size:12px;
}
.history-item:last-child{border-bottom:none}
.history-item .roll{color:var(--accent);font-weight:bold}
.history-item .total{color:var(--text)}
.history-item .time{color:var(--text-dim);font-size:10px}
/* ---- SPELLS ---- */
.spell-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:10px 12px;
  margin-bottom:8px;
  transition:border-color .15s;
}
.spell-card:hover{border-color:var(--accent)}
.spell-card .spell-name{color:var(--accent);font-weight:bold;font-size:14px}
.spell-card .spell-meta{font-size:11px;color:var(--text-dim);margin:2px 0 4px}
.spell-card .spell-meta span{margin-right:10px}
.spell-card .spell-desc{font-size:12px;color:var(--text);line-height:1.4}
.spell-tag{
  display:inline-block;
  background:var(--bg3);
  padding:1px 6px;
  border-radius:3px;
  font-size:10px;
  color:var(--text-dim);
  margin-right:4px;
}
/* ---- RULES ---- */
.rules-table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12px}
.rules-table th,.rules-table td{
  border:1px solid var(--border);
  padding:6px 8px;
  text-align:left;
}
.rules-table th{background:var(--bg3);color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.rules-table td{background:var(--bg2)}
.condition-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:12px}
.condition-item{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:4px;
  padding:8px 10px;
}
.condition-item strong{color:var(--accent);font-size:13px}
.condition-item p{font-size:12px;color:var(--text-dim);margin-top:2px}
.collapse{display:none}
/* ---- FILTERS ---- */
.filter-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter-bar select,.filter-bar input{flex:1;min-width:0}
/* ---- RESPONSIVE ---- */
@media(max-width:400px){
  #content{padding:8px}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
  .dice-grid{grid-template-columns:repeat(3,1fr)}
  .dice-result .number{font-size:40px}
  .tab-btn{font-size:10px;padding:8px 2px}
}
/* Misc */
.text-center{text-align:center}
.mt-8{margin-top:8px}
.mb-8{margin-bottom:8px}
.hidden{display:none!important}
.badge{
  display:inline-block;
  background:var(--accent);
  color:var(--bg);
  padding:0 6px;
  border-radius:3px;
  font-size:10px;
  font-weight:bold;
}
.badge-danger{background:var(--hp-red);color:#fff}
.empty-state{padding:30px 20px;text-align:center;color:var(--text-dim);font-size:13px}

/* ===== GAME STYLES ===== */
.game-panel{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:12px;
  margin-bottom:10px;
}
.narrator-panel{
  flex:1;
  min-height:200px;
  max-height:280px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.narrator-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  padding-bottom:6px;
  border-bottom:1px solid var(--border);
}
.narrator-title{color:var(--accent);font-weight:bold;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.location-badge{
  background:var(--bg3);
  border:1px solid var(--border);
  padding:2px 8px;
  border-radius:3px;
  font-size:10px;
  color:var(--text-dim);
  text-transform:uppercase;
  letter-spacing:1px;
}
/* ---- Voice Panel ---- */
.narrator-panel{position:relative}
.voice-header-controls{display:flex;gap:4px;align-items:center;margin-left:auto}
.btn-voice-toggle{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  font-size:16px;width:32px;height:28px;border-radius:4px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;line-height:1;
}
.btn-voice-toggle:hover{border-color:var(--accent);background:var(--bg2)}
.btn-voice-toggle.active{border-color:var(--accent);background:rgba(200,164,78,0.15)}
.voice-panel{
  position:absolute;top:100%;left:0;right:0;z-index:50;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:0 0 6px 6px;max-height:260px;overflow-y:auto;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.voice-panel::-webkit-scrollbar{width:4px}
.voice-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.voice-panel .vp-header{
  padding:8px 10px 6px;font-size:10px;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:1px;
  border-bottom:1px solid var(--border);display:flex;justify-content:space-between;
  position:sticky;top:0;background:var(--bg2);z-index:1;
}
.voice-panel .vp-count{color:var(--accent);font-weight:bold}
.vp-item{
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;cursor:pointer;transition:background .12s;
  border-bottom:1px solid var(--bg3);
}
.vp-item:last-child{border-bottom:none}
.vp-item:hover{background:var(--bg3)}
.vp-item.selected{background:rgba(200,164,78,0.12);border-left:3px solid var(--accent);padding-left:7px}
.vp-item .vp-check{width:16px;text-align:center;flex-shrink:0;font-size:12px;color:var(--accent);opacity:0}
.vp-item.selected .vp-check{opacity:1}
.vp-item .vp-info{flex:1;min-width:0}
.vp-item .vp-name{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp-item .vp-lang{font-size:10px;color:var(--text-dim)}
.vp-item .vp-badge{font-size:11px;flex-shrink:0}
.vp-item .vp-test-btn{
  font-size:10px;padding:2px 8px;background:var(--bg);
  border:1px solid var(--border);color:var(--text-dim);
  border-radius:3px;cursor:pointer;font-family:inherit;
  transition:all .12s;flex-shrink:0;
}
.vp-item .vp-test-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--bg2)}
.vp-empty{padding:20px;text-align:center;color:var(--text-dim);font-size:12px}
.narrator-text{
  flex:1;
  overflow-y:auto;
  font-size:13px;
  line-height:1.6;
  color:var(--text);
  padding:4px 2px;
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}
.narrator-text::-webkit-scrollbar{width:4px}
.narrator-text::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.narrator-entry{
  margin-bottom:10px;
  padding:6px 8px;
  background:var(--bg);
  border-radius:4px;
  border-left:3px solid var(--accent);
  animation:fadeIn .4s ease-out;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.narrator-entry.combat{background:rgba(150,40,27,0.15);border-left-color:var(--hp-red)}
.narrator-entry.explore{background:rgba(200,164,78,0.1);border-left-color:var(--accent)}
.narrator-entry.loot{background:rgba(45,90,123,0.15);border-left-color:var(--mana-blue)}
.narrator-entry.rest{background:rgba(0,120,60,0.15);border-left-color:#2e8b57}
.narrator-entry .type-tag{
  display:inline-block;
  font-size:8px;
  text-transform:uppercase;
  padding:0 4px;
  border-radius:2px;
  margin-right:6px;
  font-weight:bold;
}
.narrator-entry.combat .type-tag{background:var(--hp-red);color:#fff}
.narrator-entry.explore .type-tag{background:var(--accent);color:var(--bg)}
.narrator-entry.loot .type-tag{background:var(--mana-blue);color:#fff}
.narrator-entry.rest .type-tag{background:#2e8b57;color:#fff}

.status-bar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:10px;
  margin-bottom:10px;
  flex-shrink:0;
}
.status-item{text-align:center}
.status-label{display:block;font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.status-value{font-size:16px;font-weight:bold;color:var(--accent)}
#status-hp{color:var(--hp-red)}
#status-gold{color:#c8a44e}

.combat-tracker{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:10px;
  margin-bottom:10px;
  flex-shrink:0;
}
.combat-header{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:bold}
.initiative-entry{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 10px;
  background:var(--bg);
  border-radius:4px;
  margin-bottom:4px;
  font-size:12px;
  border-left:3px solid var(--text-dim);
}
.initiative-entry.player{border-left-color:var(--accent);background:rgba(200,164,78,0.1)}
.initiative-entry.current{box-shadow:0 0 0 2px var(--accent);transform:scale(1.01)}
.initiative-name{font-weight:bold}
.initiative-hp{color:var(--hp-red);font-family:monospace}
.initiative-badge{
  background:var(--bg3);
  padding:1px 6px;
  border-radius:3px;
  font-size:9px;
  color:var(--text-dim);
}

.enemies-panel{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:10px;
  margin-bottom:10px;
  flex-shrink:0;
}
.enemies-header{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:bold}
.enemy-card{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:4px;
  padding:8px;
  margin-bottom:6px;
}
.enemy-card.dead{opacity:0.4;text-decoration:line-through}
.enemy-name{font-weight:bold;color:var(--accent);font-size:13px}
.enemy-stats{font-size:11px;color:var(--text-dim);margin:2px 0}
.enemy-hp-bar{
  height:6px;
  background:var(--bg3);
  border-radius:3px;
  overflow:hidden;
  margin-top:4px;
}
.enemy-hp-fill{
  height:100%;
  background:var(--hp-red);
  transition:width .3s ease;
}
.enemy-hp-text{font-size:10px;color:var(--text-dim);text-align:right;margin-top:2px;font-family:monospace}

.action-panel{
  flex-shrink:0;
}
.action-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}
.action-btn{
  background:var(--bg3);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px;
  border-radius:6px;
  font-family:inherit;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:1px;
  cursor:pointer;
  transition:all .15s;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.action-btn:hover,.action-btn:focus{border-color:var(--accent);color:var(--accent);background:var(--bg2);transform:translateY(-1px)}
.action-btn:disabled{opacity:0.4;cursor:not-allowed}
.action-btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.action-btn.primary:hover{background:#b8942e;border-color:#b8942e}
.action-btn.danger{background:var(--hp-red);border-color:var(--hp-red);color:#fff}
.action-btn.danger:hover{background:#7a1f15;border-color:#7a1f15}
.action-icon{font-size:18px}
.action-label{font-size:11px;text-transform:uppercase;letter-spacing:1px}

#game-menu{text-align:center}
#menu-buttons{margin-top:20px}

.scene-visual{
  width:100%;height:140px;position:relative;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;border-bottom:2px solid var(--border);
  transition:background .6s ease;
}
.scene-visual .visual-art{
  font-size:48px;letter-spacing:10px;
  text-shadow:0 0 24px rgba(0,0,0,0.7),0 2px 6px rgba(0,0,0,0.5);
  z-index:2;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  padding:10px;background:rgba(0,0,0,0.15);border-radius:12px;
}
.scene-visual .visual-label{
  position:absolute;bottom:0;left:0;right:0;
  padding:8px 12px 6px;
  background:linear-gradient(transparent,rgba(0,0,0,0.85));
  color:var(--accent);font-size:13px;
  text-transform:uppercase;letter-spacing:2px;text-align:center;
  z-index:2;
}
.visual-village{background:linear-gradient(135deg,#2d5016,#4a7c2e,#5a8f3a)}
.visual-warm{background:linear-gradient(135deg,#5a2d0c,#8b4513,#a0522d)}
.visual-market{background:linear-gradient(135deg,#5a3e1e,#8b6914,#a07d2d)}
.visual-forge{background:linear-gradient(135deg,#4a1a0a,#7a2d0c,#a03a15)}
.visual-holy{background:linear-gradient(135deg,#1a2a4a,#2d4a7a,#3a6b9a)}
.visual-dark{background:linear-gradient(135deg,#1a0e0e,#2d1a1a,#3d2525)}
.visual-dungeon{background:linear-gradient(135deg,#0e1a0e,#1a2d1a,#253d25)}
.visual-forest{background:linear-gradient(135deg,#1a2d0e,#2d4a1a,#3a6b25)}
.visual-danger{background:linear-gradient(135deg,#2d0a0a,#4a1515,#6b1a1a)}
.visual-default{background:linear-gradient(135deg,#1a1815,#252220,#3d3530)}

/* ---- Typewriter ---- */
.typing-cursor::after{
  content:'▍';animation:blink 0.7s steps(1) infinite;
  color:var(--accent);margin-left:2px;
}
@keyframes blink{50%{opacity:0}}

/* ---- Screen Shake ---- */
.shake{animation:shake .3s ease-in-out}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  10%,50%,90%{transform:translateX(-4px)}
  30%,70%{transform:translateX(4px)}
}

/* ---- Hit Flash ---- */
.hit-flash{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:999;pointer-events:none;
  animation:flash .3s ease-out forwards;
}
.hit-flash.damage{background:radial-gradient(circle,rgba(200,50,30,0.3),transparent 60%)}
.hit-flash.crit{background:radial-gradient(circle,rgba(255,200,50,0.4),transparent 70%)}
.hit-flash.heal{background:radial-gradient(circle,rgba(50,200,80,0.25),transparent 60%)}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@keyframes critFlash{
  0%{opacity:1;transform:scale(1)}
  50%{opacity:1;transform:scale(1.05)}
  100%{opacity:0;transform:scale(1)}
}
.hit-flash.crit{animation:critFlash .5s ease-out forwards}

/* ---- Damage Numbers ---- */
.dmg-popup{
  position:fixed;z-index:1000;pointer-events:none;
  font-family:inherit;font-size:22px;font-weight:bold;
  text-shadow:0 0 10px rgba(0,0,0,0.8),0 2px 4px rgba(0,0,0,0.5);
  animation:dmgFloat 1s ease-out forwards;
}
.dmg-popup.damage{color:#ff4444}
.dmg-popup.crit{color:#ffcc00;font-size:30px}
.dmg-popup.heal{color:#44ff66}
@keyframes dmgFloat{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-60px) scale(1.2)}
}

/* ---- Ambient Particles ---- */
#ambient-particles{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;overflow:hidden;z-index:1;
}
.particle{
  position:absolute;width:6px;height:6px;border-radius:50%;
  opacity:0;animation:particleFade linear infinite;
}
.particle.leaf{width:10px;height:6px;border-radius:2px;background:#5a8f3a;opacity:0.6}
.particle.ember{width:4px;height:4px;background:#ff6622;box-shadow:0 0 6px #ff6622}
.particle.spark{width:3px;height:3px;background:#ffcc00;box-shadow:0 0 8px #ffaa00}
.particle.dust{width:8px;height:8px;background:#8a8075;opacity:0.2}
.particle.mist{width:12px;height:12px;background:#aabbcc;opacity:0.08;border-radius:50%}
.particle.firefly{width:5px;height:5px;background:#aaff66;box-shadow:0 0 10px #66ff33;opacity:0.7}
.particle.orb{width:6px;height:6px;background:#88bbff;box-shadow:0 0 12px #4488ff;opacity:0.5}
@keyframes particleFade{
  0%{opacity:0;transform:translateY(0) translateX(0) scale(0.5)}
  10%{opacity:var(--p-opacity,0.6)}
  90%{opacity:var(--p-opacity,0.6)}
  100%{opacity:0;transform:translateY(var(--p-fall,-120px)) translateX(var(--p-drift,30px)) scale(1)}
}

/* ---- Voice Controls ---- */
.voice-controls{
  display:flex;gap:6px;align-items:center;
  padding:6px 8px;background:var(--bg);border-top:1px solid var(--border);
}
.voice-controls label{font-size:10px;margin:0;display:flex;align-items:center;gap:3px;color:var(--text-dim)}
.voice-controls input[type=range]{
  width:50px;height:3px;appearance:none;background:var(--border);
  border-radius:2px;outline:none;cursor:pointer;
}
.voice-controls input[type=range]::-webkit-slider-thumb{
  appearance:none;width:10px;height:10px;border-radius:50%;
  background:var(--accent);cursor:pointer;
}
#btn-test-voice{
  font-size:10px;padding:2px 6px;margin-left:auto;
  background:var(--bg2);color:var(--text-dim);
  border:1px solid var(--border);border-radius:3px;cursor:pointer;
}
#btn-test-voice:hover{color:var(--accent);border-color:var(--accent)}
#btn-debug-voices{font-size:10px;padding:1px 6px;background:var(--bg2);color:var(--text-dim);border:1px solid var(--border);border-radius:3px;cursor:pointer}
#btn-debug-voices:hover{color:var(--accent);border-color:var(--accent)}

@media(max-width:400px){
  .status-bar{grid-template-columns:repeat(2,1fr);gap:6px;padding:8px}
  .action-grid{grid-template-columns:1fr}
  .narrator-text{font-size:12px}
  .initiative-entry{font-size:11px;padding:4px 8px}
  .scene-visual{height:100px}
  .scene-visual .visual-art{font-size:36px;padding:6px}
  .voice-controls{flex-wrap:wrap}
  .voice-controls input[type=range]{width:40px}
}
</style>
</head>
<body>
<div id="app">

<script>
(function(){
'use strict';

const D = window.DND || {};

// ---- Compatibility: map Spanish data keys to English names ----
(function(D){
  // Top-level aliases
  if(D.razas){
    D.races = D.razas;
    D.races.forEach(r => {
      r.name = r.nombre; r.bonuses = r.bonos; r.bonusChoice = r.bonos_eleccion;
      var abilMap = {str:'FUE', dex:'DES', con:'CON', int:'INT', wis:'SAB', cha:'CAR'};
      if(r.bonuses){
        var newBonuses = {};
        Object.keys(r.bonuses).forEach(function(k){
          if(abilMap[k]) newBonuses[abilMap[k]] = r.bonuses[k];
        });
        r.bonuses = newBonuses;
      }
      if(r.rasgos_extra) r.rasgos = r.rasgos_extra;
    });
  }
  if(D.clases){
    D.classes = D.clases;
    D.classes.forEach(c => {
      c.name = c.nombre;
      c.hitDie = parseInt((c.dado_golpe||'').replace('d','')) || 8;
      if(c.competencias){
        c.armor = c.competencias.armaduras ? c.competencias.armaduras.join(', ') : '';
        c.weapons = c.competencias.armas ? c.competencias.armas.join(', ') : '';
        c.savingThrows = c.competencias.salvaciones || [];
        c.skills = c.competencias.habilidades || [];
      }
    });
  }
  if(D.trasfondos){
    D.backgrounds = D.trasfondos;
    D.backgrounds.forEach(b => { b.name = b.nombre; });
  }
  if(D.hechizos){
    D.spells = D.hechizos;
    D.spells.forEach(s => {
      s.name = s.nombre; s.school = s.escuela;
      s.castingTime = s.tiempo; s.range = s.alcance;
      s.duration = s.duracion; s.description = s.descripcion;
      s.level = s.nivel; s.classes = s.clases;
    });
  }
  if(D.subrazas){
    D.subraces = D.subrazas;
    D.subraces.forEach(sr => { sr.bonuses = sr.bonos; });
  }
})(D);

// ---- State ----
const state = {
  rolledScores: [],
  assigned: {},       // ability -> score
  selectedStat: null,
  character: null,
  history: [],
};

// ---- DOM refs ----
const $ = id => document.getElementById(id);
const charForm = $('char-form');
const charOutput = $('char-output');
const raceSel = $('char-race');
const subraceSel = $('char-subrace');
const subraceGroup = $('subrace-group');
const classSel = $('char-class');
const bgSel = $('char-bg');
const statGrid = $('stat-grid');
const assignGrid = $('assign-grid');
const assignSection = $('assign-section');
const generateBtn = $('generate-btn');

// ---- Init selects ---- 
function initSelects(){
  // Races
  const races = D.races || [];
  races.forEach(r => {
    const o = document.createElement('option');
    o.value = r.name;
    o.textContent = r.name;
    raceSel.appendChild(o);
  });
  // Classes
  const classes = D.classes || [];
  classes.forEach(c => {
    const o = document.createElement('option');
    o.value = c.name;
    o.textContent = c.name;
    classSel.appendChild(o);
  });
  // Backgrounds
  const bgs = D.backgrounds || [];
  bgs.forEach(b => {
    const o = document.createElement('option');
    o.value = b.name;
    o.textContent = b.name;
    bgSel.appendChild(o);
  });
  // Spell filters
  const spells = D.spells || [];
  const classesSet = new Set();
  spells.forEach(s => (s.classes||[]).forEach(cl => classesSet.add(cl)));
  const sortedClasses = [...classesSet].sort();
  const classFilter = $('spell-class-filter');
  sortedClasses.forEach(cl => {
    const o = document.createElement('option');
    o.value = cl;
    o.textContent = cl;
    classFilter.appendChild(o);
  });
  const levelFilter = $('spell-level-filter');
  for(let i=1;i<=9;i++){
    const o = document.createElement('option');
    o.value = i;
    o.textContent = 'Nivel '+i;
    levelFilter.appendChild(o);
  }
  const schoolsSet = new Set();
  spells.forEach(s => {if(s.school) schoolsSet.add(s.school)});
  const schoolFilter = $('spell-school-filter');
  [...schoolsSet].sort().forEach(sc => {
    const o = document.createElement('option');
    o.value = sc;
    o.textContent = sc;
    schoolFilter.appendChild(o);
  });
  // Dice grid
  const diceGrid = $('dice-grid');
  [4,6,8,10,12,20,100].forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'dice-btn';
    btn.innerHTML = 'd' + d + '<span class="label">' + (d===100?'&#37;':'') + '</span>';
    btn.dataset.dice = d;
    btn.addEventListener('click', ()=>rollDice(1,d));
    diceGrid.appendChild(btn);
  });
}

// ---- Subraces ----
raceSel.addEventListener('change', function(){
  const race = D.races ? D.races.find(r => r.name === this.value) : null;
  subraceGroup.style.display = 'none';
  subraceSel.innerHTML = '<option value="">—</option>';
  if(race && race.subraces && race.subraces.length){
    race.subraces.forEach(sr => {
      const o = document.createElement('option');
      o.value = sr;
      o.textContent = sr;
      subraceSel.appendChild(o);
    });
    subraceGroup.style.display = 'block';
  }
});

// ---- Class info display ----
let lastClassInfo = null;
classSel.addEventListener('change', function(){
  const cls = D.classes ? D.classes.find(c => c.name === this.value) : null;
  // remove old info
  if(lastClassInfo) { lastClassInfo.remove(); lastClassInfo = null; }
  if(!cls) return;
  const div = document.createElement('div');
  div.className = 'sheet';
  div.style.marginBottom = '8px';
  div.style.fontSize = '12px';
  let html = '<strong style="color:var(--accent)">' + cls.name + '</strong><br>';
  if(cls.hitDie) html += 'Dado de Golpe: <span class="badge">d' + cls.hitDie + '</span><br>';
  if(cls.armor) html += 'Armaduras: ' + cls.armor + '<br>';
  if(cls.weapons) html += 'Armas: ' + cls.weapons + '<br>';
  if(cls.savingThrows) html += 'Tiradas Salvación: ' + cls.savingThrows.join(', ') + '<br>';
  if(cls.skills) html += 'Habilidades: ' + cls.skills.join(', ') + '<br>';
  div.innerHTML = html;
  classSel.parentNode.parentNode.insertAdjacentElement('afterend', div); // after the form-row containing class
  lastClassInfo = div;
});

// ---- Stat generation ----
$('roll-stats-btn').addEventListener('click', function(){
  const method = $('stat-method').value;
  let scores;
  if(method === 'standard'){
    scores = [15,14,13,12,10,8];
  } else {
    scores = [];
    for(let i=0;i<6;i++){
      const rolls = [];
      for(let j=0;j<4;j++) rolls.push(Math.floor(Math.random()*6)+1);
      rolls.sort((a,b)=>a-b);
      rolls.shift();
      scores.push(rolls.reduce((s,v)=>s+v,0));
    }
  }
  state.rolledScores = scores;
  state.selectedStat = null;
  state.assigned = {};
  renderStatGrid(scores);
  assignSection.style.display = 'block';
  renderAssignGrid();
  generateBtn.textContent = 'Generar Personaje';
});

function renderStatGrid(scores){
  const abils = ['FUE','DES','CON','INT','SAB','CAR'];
  statGrid.innerHTML = '';
  scores.forEach((sc,i) => {
    const card = document.createElement('div');
    card.className = 'stat-card';
    const mod = Math.floor((sc-10)/2);
    const modStr = (mod>=0?'+':'')+mod;
    card.innerHTML = '<div class="stat-label">' + abils[i] + '</div><div class="stat-value">' + sc + '</div><div class="stat-mod">(' + modStr + ')</div>';
    card.dataset.idx = i;
    card.addEventListener('click', function(e){
      e.stopPropagation();
      state.selectedStat = i;
      document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('selected'));
      this.classList.add('selected');
      renderAssignGrid();
    });
    statGrid.appendChild(card);
  });
}

function renderAssignGrid(){
  const abils = ['Fuerza','Destreza','Constitución','Inteligencia','Sabiduría','Carisma'];
  const abilsShort = ['FUE','DES','CON','INT','SAB','CAR'];
  assignGrid.innerHTML = '';
  var assignedScores = Object.values(state.assigned);
  var usedIndices = {};
  state.rolledScores.forEach(function(sc, idx){
    var pos = assignedScores.indexOf(sc);
    if(pos !== -1){
      usedIndices[idx] = true;
      assignedScores[pos] = null;
    }
  });
  
  const table = document.createElement('table');
  table.className = 'rules-table';
  table.style.marginBottom = '0';
  let html = '<thead><tr><th>Habilidad</th><th>Puntaje</th><th>Mod</th><th></th></tr></thead><tbody>';
  abils.forEach((a,i) => {
    const assigned = state.assigned[abilsShort[i]];
    const mod = assigned !== undefined ? Math.floor((assigned-10)/2) : 0;
    const modStr = assigned !== undefined ? ((mod>=0?'+':'')+mod) : '—';
    const valStr = assigned !== undefined ? assigned : '—';
    const canAssign = assigned === undefined && state.selectedStat !== null && state.rolledScores[state.selectedStat] !== undefined && !usedIndices[state.selectedStat];
    const isSelectedScore = (assigned === undefined && i === state.selectedStat);
    html += '<tr>';
    html += '<td>' + a + '</td>';
    html += '<td>' + valStr + '</td>';
    html += '<td>' + modStr + '</td>';
    html += '<td>';
    if(canAssign && !isSelectedScore){
      html += '<button class="btn btn-sm" data-abil="'+abilsShort[i]+'" data-idx="'+state.selectedStat+'">Asignar</button>';
    } else if(assigned !== undefined){
      html += '<button class="btn btn-sm btn-danger" data-clear="'+abilsShort[i]+'">X</button>';
    }
    html += '</td></tr>';
  });
  html += '</tbody></table>';
  assignGrid.innerHTML = html;
  
  assignGrid.querySelectorAll('[data-abil]').forEach(btn => {
    btn.addEventListener('click', function(){
      const abil = this.dataset.abil;
      const idx = parseInt(this.dataset.idx);
      const score = state.rolledScores[idx];
      if(state.assigned[abil] !== undefined) return;
      state.assigned[abil] = score;
      state.selectedStat = null;
      document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('selected'));
      renderAssignGrid();
    });
  });
  assignGrid.querySelectorAll('[data-clear]').forEach(btn => {
    btn.addEventListener('click', function(){
      delete state.assigned[this.dataset.clear];
      renderAssignGrid();
    });
  });
}

  const race = D.races ? D.races.find(r => r.name === raceName) : null;
  const cls = D.classes ? D.classes.find(c => c.name === className) : null;
  const bg = D.backgrounds ? D.backgrounds.find(b => b.name === bgName) : null;
  
  // Build sheet
  let scores = {};
  abilsShort.forEach((a,i) => {
    let base = assigned[a];

      if(race.bonusChoice && subraceName){
        // In a full version we'd parse; for simplicity we'll apply subrace bonus manually or from DND data
      }
    }
    // Subrace

      const sr = D.subraces.find(s => s.nombre === subraceName);
      if(sr && sr.bonuses && sr.bonuses[a]) base += sr.bonuses[a];
    }
    scores[a] = base;
  });
  
  const mods = {};
  Object.keys(scores).forEach(k => {
    mods[k] = Math.floor((scores[k]-10)/2);
  });
  
  const hp = cls ? (cls.hitDie || 8) + mods['CON'] : 8 + mods['CON'];
  
  // Calculate AC with equipped armor

  if(state.equippedItems && state.equippedItems.armor){
    const armor = armorList.find(a => a.nombre === state.equippedItems.armor);

      if(armor.tipo === 'Ligera'){
        ca = armor.ca + mods['DES'];
        caDetail = armor.nombre + ' (CA base ' + armor.ca + ' + DES)';
      } else if(armor.tipo === 'Media'){
        const desMax = Math.min(mods['DES'], 2);

      }
    }
  }
  // Shield bonus
  if(state.equippedItems && state.equippedItems.shield){
    ca += 2;
    if(!caDetail) caDetail = 'Escudo (+2)';
    else caDetail += ' + Escudo (+2)';
  }
  
  const speed = (race && race.velocidad) ? race.velocidad + (subraceName==='Wood Elf'?5:0) : 30;

  html += '<div><span style="color:var(--text-dim)">Idiomas:</span> <span style="font-weight:bold">' + languages + '</span></div>';
  html += '</div>';
  
  // Stats

  abilsShort.forEach(a => { html += '<th>' + a + '</th>'; });

// ---- Dice ----
function rollDice(count, sides){
  const rolls = [];
  for(let i=0;i<count;i++) rolls.push(Math.floor(Math.random()*sides)+1);
  const total = rolls.reduce((s,v)=>s+v,0);
  const numEl = $('dice-number');
  const detailEl = $('dice-detail');
  
  if(numEl.classList.contains('roll-anim')){
    numEl.classList.remove('roll-anim');
    void numEl.offsetWidth;
  }
  numEl.textContent = total;
  numEl.classList.add('roll-anim');
  
  if(count > 1){
    detailEl.textContent = count + 'd' + sides + ' = [' + rolls.join(', ') + '] = ' + total;
  } else {
    detailEl.textContent = 'd' + sides + ' = ' + total;
  }
  
  // History
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  state.history.unshift({
    label: count + 'd' + sides,
    total: total,
    detail: '[' + rolls.join(', ') + ']',
    time: timeStr
  });
  if(state.history.length > 10) state.history.pop();
  renderHistory();
}

$('roll-custom-btn').addEventListener('click', function(){
  const input = $('custom-roll').value.trim().toLowerCase();
  if(!input) return;
  // Parse simple pattern: NdX+Y or NdX-Y
  const m = input.match(/^(\d+)?d(\d+)([+-]\d+)?$/);
  if(!m){ alert('Formato: 2d20+4'); return; }
  const count = parseInt(m[1]) || 1;
  const sides = parseInt(m[2]);
  const mod = parseInt(m[3]) || 0;
  if(count < 1 || sides < 2 || isNaN(count) || isNaN(sides)){ alert('Tirada inválida.'); return; }
  const rolls = [];
  for(let i=0;i<count;i++) rolls.push(Math.floor(Math.random()*sides)+1);
  const total = rolls.reduce((s,v)=>s+v,0) + mod;
  const numEl = $('dice-number');
  if(numEl.classList.contains('roll-anim')){
    numEl.classList.remove('roll-anim');
    void numEl.offsetWidth;
  }
  numEl.textContent = total;
  numEl.classList.add('roll-anim');
  let detail = count + 'd' + sides;
  if(mod) detail += (mod>0?'+':'') + mod;
  detail += ' = [' + rolls.join(', ') + ']';
  if(mod) detail += ' + (' + (mod>=0?'+':'') + mod + ')';
  detail += ' = ' + total;
  $('dice-detail').textContent = detail;
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  state.history.unshift({
    label: count + 'd' + sides + (mod?(mod>0?'+':'')+mod:''),
    total: total,
    detail: '[' + rolls.join(', ') + ']' + (mod?' '+(mod>=0?'+':'')+mod:''),
    time: timeStr
  });
  if(state.history.length > 10) state.history.pop();
  renderHistory();
});

function renderHistory(){
  const el = $('roll-history');
  if(!state.history.length){
    el.innerHTML = '<div class="empty-state">Sin tiradas aún</div>';
    return;
  }
  el.innerHTML = state.history.map(h => 
    '<div class="history-item"><span><span class="roll">' + h.label + '</span> <span class="total">' + h.total + '</span> <span style="color:var(--text-dim)">' + h.detail + '</span></span><span class="time">' + h.time + '</span></div>'
  ).join('');
}

// ---- Spells ----
function renderSpells(){
  const spells = D.spells || [];
  const classFilter = $('spell-class-filter').value;
  const levelFilter = $('spell-level-filter').value;
  const schoolFilter = $('spell-school-filter').value;
  const search = $('spell-search').value.trim().toLowerCase();
  
  let filtered = spells.filter(s => {
    if(classFilter && (!s.classes || !s.classes.includes(classFilter))) return false;
    if(levelFilter && s.level !== parseInt(levelFilter)) return false;
    if(schoolFilter && s.school !== schoolFilter) return false;
    if(search && !s.name.toLowerCase().includes(search)) return false;
    return true;
  });
  
  const el = $('spell-list');
  if(!filtered.length){
    el.innerHTML = '<div class="empty-state">No se encontraron hechizos</div>';
    return;
  }
  el.innerHTML = filtered.map(s => {
    const levelWord = s.level === 0 ? 'Truco' : (s.level === 1 ? 'Nivel 1' : 'Nivel '+s.level);
    const schoolColor = s.school === 'Ilusión' ? '#b07cc9' : s.school === 'Nigromancia' ? '#6b8e6b' : s.school === 'Evocación' ? '#c97a3a' : s.school === 'Encantamiento' ? '#c97a9a' : s.school === 'Adivinación' ? '#7a9ac9' : s.school === 'Ablación' ? '#7ac9b0' : s.school === 'Transmutación' ? '#c9b07a' : s.school === 'Conjuración' ? '#7ac97a' : 'var(--text-dim)';
    return '<div class="spell-card"><div class="spell-name">' + s.name + '</div><div class="spell-meta"><span>🔮 ' + levelWord + ' ' + s.school + '</span><span>⏱ ' + (s.castingTime||'—') + '</span><span>📏 ' + (s.range||'—') + '</span><span>⏳ ' + (s.duration||'—') + '</span></div><div class="spell-desc">' + (s.description||'') + '</div></div>';
  }).join('');
}

  // ---- TTS: voice state & debug ----
  var _voiceReady = false;

  // ---- TTS: find best natural voice ----
  function findBestVoice(){
    var allVoices = window.speechSynthesis.getVoices();
    if(!allVoices.length) return null;
    // If user selected a specific voice, try to find it
    if(game.selectedVoice){
      var match = allVoices.find(function(v){ return v.name === game.selectedVoice; });
      if(match) return match;
      game.selectedVoice = '';
    }
    // Spanish voices (all variants: es-ES, es-MX, es-US, es-AR, etc.)
    var es = allVoices.filter(function(v){ return v.lang && v.lang.indexOf('es') === 0; });
    var best =
      // 1st: Google/Microsoft voices (best quality)
      es.find(function(v){ return /google|microsoft/i.test(v.name); }) ||
      // 2nd: any neural/natural/premium
      es.find(function(v){ return /neural|natural|premium|high.?quality/i.test(v.name); }) ||
      // 3rd: voices with explicit Spanish label
      es.find(function(v){ return /español|spanish|mexico|latino|castellano/i.test(v.name); }) ||
      // 4th: first Spanish voice available
      es[0];
    // If no Spanish voice at all, try any Google/Microsoft/neural voice in any language
    if(!best) best = allVoices.find(function(v){ return /google|microsoft|neural/i.test(v.name); });
    // Last resort: first available voice
    return best || allVoices[0] || null;
  }

  // ---- Wait for voices to be ready ----
  function waitVoices(callback){
    var voices = window.speechSynthesis.getVoices();
    if(voices.length){
      _voiceReady = true;
      callback();
      return;
    }
    var handler = function(){
      voices = window.speechSynthesis.getVoices();
      if(voices.length){
        _voiceReady = true;
        window.speechSynthesis.onvoiceschanged = null;
        callback();
        // Flush any queued speech
        while(_ttsQueue.length) speakText(_ttsQueue.shift());
      }
    };
    window.speechSynthesis.onvoiceschanged = handler;
    // Retry after a timeout in case onvoiceschanged never fires
    setTimeout(handler, 2000);
  }

  var _ttsId = 0;
  var _webTtsAudio = null;
  // ---- Web TTS (Google Translate — voz natural, sin API key) ----
  function speakViaGoogle(text){
    var chunks = text.match(/[^.!?]{1,180}[.!?]?/g) || [text];
    var idx = 0;
    function playNext(){
      if(idx >= chunks.length || _ttsId !== (_ttsId||0)) return;
      var q = encodeURIComponent(chunks[idx].trim().substring(0,200));
      _webTtsAudio = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&q=' + q + '&tl=es&client=tw-ob&ttsspeed=0.8');
      _webTtsAudio.onended = function(){ idx++; setTimeout(playNext, 120); };
      _webTtsAudio.onerror = function(){ idx++; setTimeout(playNext, 120); };
      _webTtsAudio.play().catch(function(){ /* ignored */ });
    }
    playNext();
  }

  // ---- Narrator ----
  function speakText(text){
    if(!game.ttsEnabled) return;
    _ttsId++;
    if(game.ttsMode === 'web'){
      if(!('Audio' in window)) return;
      speakViaGoogle(text);
      return;
    }
    // Local TTS (Web Speech API)
    if(!('speechSynthesis' in window)) return;
    if(!_voiceReady){
      _ttsQueue.push(text);
      if(window.speechSynthesis.getVoices().length){
        _voiceReady = true;
      } else {
        waitVoices(function(){ /* already flushed via queue */ });
        return;
      }
    }
    window.speechSynthesis.cancel();
    var myId = _ttsId;
    var rate = parseFloat($('voice-rate').value) || 0.9;
    var pitch = parseFloat($('voice-pitch').value) || 1.0;
    var sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
    rate = Math.max(0.5, Math.min(1.5, rate));
    pitch = Math.max(0.5, Math.min(1.5, pitch));
    var idx = 0;
    function speakNext(){
      if(idx >= sentences.length || myId !== _ttsId) return;
      var u = new SpeechSynthesisUtterance(sentences[idx].trim());
      var voice = findBestVoice();
      if(voice){
        u.voice = voice;
        u.lang = voice.lang;
      } else {
        u.lang = 'es-MX';
      }
      u.rate = rate;
      u.pitch = pitch;
      u.volume = 1.0;
      u.onend = function(){ idx++; setTimeout(function(){ speakNext(); }, 80); };
      window.speechSynthesis.speak(u);
    }
    speakNext();
  }

  function buildVoicePanel(){

    function cleanName(name){
      return name.replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
    }
    function getQuality(name){
      if(/google|microsoft/i.test(name)) return {icon:'⭐', label:'Premium'};
      if(/neural|natural|premium|high.?quality|enhanced|wavenet/i.test(name)) return {icon:'🔊', label:'Neural'};
      return {icon:'🎙️', label:'Sistema'};
    }
    function sortScore(v){
      var s = 0;
      if(v.lang && v.lang.indexOf('es')===0) s += 100;
      if(v.name === cur) s += 200;
      if(/google|microsoft/i.test(v.name)) s += 50;
      if(/neural|natural|premium|high.?quality/i.test(v.name)) s += 25;
      return -s;

    var sorted = [].concat(allVoices).sort(function(a,b){ return sortScore(a) - sortScore(b); });

  }

        if(armor.tipo === 'Ligera'){ game.player.ac = armor.ca + (game.player.mods['DES']||0); }
        else if(armor.tipo === 'Media'){ game.player.ac = armor.ca + Math.min(game.player.mods['DES']||0, 2); }
        else if(armor.tipo === 'Pesada'){ game.player.ac = armor.ca; }
      }
    }
    if(game.player.shield) game.player.ac += 2;
    game.gold = 0;
    game.inventory = [];
    game.xp = 0;
  }

  // ---- Weapon Helper ----
  function getWeaponData(name){
    if(!name) return null;
    const allWeapons = [].concat(
      (D.equipo && D.equipo.armas_simples)||[],
      (D.equipo && D.equipo.armas_marciales)||[]
    );
    return allWeapons.find(w => w.nombre === name) || null;
  }
  function getWeaponDamage(weapon){
    if(!weapon) return '1d4';
    const wpn = getWeaponData(weapon);
    if(!wpn || !wpn.daño) return '1d4';
    return wpn.daño;
  }
  function getWeaponType(weapon){
    const wpn = getWeaponData(weapon);
    return wpn ? (wpn.tipo||'') : '';
  }
  function getAttackBonus(){
    const wpn = getWeaponData(game.player.weapon);
    if(!wpn) return game.player.mods['DES']||0;
    const isFinesse = wpn.propiedades && wpn.propiedades.indexOf('Finesse') !== -1;
    const isRange = wpn.tipo === 'Perforante' && (wpn.propiedades||'').indexOf('Cerca') !== -1;
    if(isFinesse) return Math.max(game.player.mods['FUE']||0, game.player.mods['DES']||0) + game.player.proficiency;
    if(isRange) return (game.player.mods['DES']||0) + game.player.proficiency;
    return (game.player.mods['FUE']||0) + game.player.proficiency;
  }

  // ---- Monster Helper ----
  function getMonsterData(name){
    return (D.bestiario||[]).find(m => m.nombre === name) || null;
  }
  function parseMonsterHP(pgStr){
    if(!pgStr) return 10;
    const m = pgStr.match(/(\d+)/);
    return m ? parseInt(m[1]) : 10;
  }
  function getMonsterAttackBonus(monster){
    // Parse from acciones
    const acciones = monster.acciones || [];
    if(acciones.length === 0) return 0;
    // Look for +N in action descriptions
    for(let i=0;i<acciones.length;i++){
      const m = acciones[i].desc.match(/\+(\d+)\s*a\s*golpear/);
      if(m) return parseInt(m[1]);
    }
    return 0;
  }
  function getMonsterDamage(monster){
    const acciones = monster.acciones || [];
    for(let i=0;i<acciones.length;i++){
      const m = acciones[i].desc.match(/(\d+d\d+)/);
      if(m) return m[1];
    }
    return '1d6';
  }

  // ---- Game UI ----
  // ---- Typewriter Narrator ----
  function renderNarrator(){
    var el = $('narrator-text');
    if(!el) return;
    var html = '';
    for(var i=0; i<game.narrator.length-1; i++){
      var n = game.narrator[i];
      html += '<div class="narrator-entry ' + (n.type||'explore') + '">' +
        '<span class="type-tag">' + (n.type||'info') + '</span>' +
        n.text + '</div>';
    }
    el.innerHTML = html;
    if(game.narrator.length){
      var last = game.narrator[game.narrator.length-1];
      var entryDiv = document.createElement('div');
      entryDiv.className = 'narrator-entry ' + (last.type||'explore');
      entryDiv.innerHTML = '<span class="type-tag">' + (last.type||'info') + '</span><span class="typing-text"></span><span class="typing-cursor"></span>';
      el.appendChild(entryDiv);
      el.scrollTop = el.scrollHeight;
      var span = entryDiv.querySelector('.typing-text');
      var t = last.text;
      var ci = 0;
      var speed = last.type === 'combat' ? 15 : 25;
      if(game._typeTimer) clearInterval(game._typeTimer);
      game._typeTimer = setInterval(function(){
        if(ci < t.length){
          span.textContent += t[ci];
          ci++;
          el.scrollTop = el.scrollHeight;
        } else {
          clearInterval(game._typeTimer);
          game._typeTimer = null;
          var cursor = entryDiv.querySelector('.typing-cursor');
          if(cursor) cursor.style.display = 'none';
        }
      }, speed);
    }
  }

  function updateStatusBar(){
    $('status-hp').textContent = game.player.hp + '/' + game.player.maxHp;
    $('status-level').textContent = game.player.level;
    $('status-xp').textContent = game.xp;
    $('status-gold').textContent = game.gold;
  }

  // ---- Ambient Particles ----
  var _particleInterval = null;
  var PARTICLE_THEMES = {
    village: { type:'leaf', count:3, speed:8, opacity:0.5 },
    warm: { type:'ember', count:4, speed:5, opacity:0.7 },
    market: { type:'dust', count:3, speed:10, opacity:0.3 },
    forge: { type:'spark', count:5, speed:4, opacity:0.8 },
    holy: { type:'orb', count:3, speed:7, opacity:0.4 },
    dark: { type:'mist', count:2, speed:12, opacity:0.15 },
    dungeon: { type:'mist', count:3, speed:10, opacity:0.2 },
    forest: { type:'leaf', count:2, speed:9, opacity:0.4 },
    danger: { type:'ember', count:3, speed:6, opacity:0.6 },
    default: { type:'dust', count:2, speed:12, opacity:0.2 }
  };

  function spawnParticles(themeId){
    var container = $('ambient-particles');
    if(!container) return;
    if(_particleInterval) clearInterval(_particleInterval);
    container.innerHTML = '';
    var cfg = PARTICLE_THEMES[themeId] || PARTICLE_THEMES.default;
    _particleInterval = setInterval(function(){
      if(!container || container.childNodes.length > 30) return;
      var p = document.createElement('div');
      p.className = 'particle ' + (cfg.type || 'dust');
      p.style.left = (Math.random() * 100) + '%';
      p.style.top = '100%';
      p.style.setProperty('--p-fall', -(80 + Math.random() * 60) + 'px');
      p.style.setProperty('--p-drift', (Math.random() * 60 - 30) + 'px');
      p.style.setProperty('--p-opacity', cfg.opacity || 0.5);
      p.style.animationDuration = (cfg.speed || 8) + 's';
      p.style.animationDelay = '0s';
      container.appendChild(p);
      setTimeout(function(){ if(p.parentNode) p.remove(); }, (cfg.speed||8)*1000 + 200);
    }, 300);
  }

  function renderVisual(scene, sceneId){
    var el = $('scene-visual');
    if(!el) return;
    var vis = SCENE_VISUALS[sceneId] || TYPE_VISUALS[scene.tipo] || TYPE_VISUALS.explore;
    el.className = 'scene-visual visual-' + (vis.theme || 'default');
    var artEl = el.querySelector('.visual-art');
    var labelEl = el.querySelector('.visual-label');
    if(artEl) artEl.textContent = vis.art || '✨';
    if(labelEl) labelEl.textContent = vis.label || scene.nombre;
    spawnParticles(vis.theme || 'default');

  function setLocation(name){
    $('game-location').textContent = name;
  }

  // ---- Game Flow ----
  function startGame(){
    const char = state.character;
    if(!char){
      alert('Primero genera un personaje en la pestaña Personaje.');
      return;
    }
    setupPlayer(char);
    game.state = 'explore';
    game.scene = 'entrada_mazmorra';
    game.narrator = [];
    game.gold = 0;
    game.inventory = [];
    game.xp = 0;
    game.combat = null;
    game.turnIndex = 0;
    game.visitedScenes = [];
    game.dungeonDepth = 0;
    game.scenePools = null;
    game.ttsEnabled = true;
    game.ttsMode = 'web';
    waitVoices(function(){ buildVoicePanel(); });
    var ttsBtn = $('btn-tts');
    if(ttsBtn) ttsBtn.textContent = '🔊 Voz';
    var modeBtn = $('btn-tts-mode');
    if(modeBtn) modeBtn.textContent = '🌐 Web';
    $('game-menu').classList.add('hidden');
    $('game-view').classList.remove('hidden');
    narrate('Te encuentras en las afueras de una aldea. El viento trae el olor a hierba y hogueras. Una antigua cripta se alza en la colina cercana.', 'explore');
    narrateRandom('ambiente_bosque', 'explore');
    enterScene('entrada_aldea');
  }

  function buildScenePools(){
    const pools = {};
    Object.keys(D.escenas).forEach(function(id){
      var s = D.escenas[id];
      var type = s.tipo || 'explore';
      if(!pools[type]) pools[type] = [];
      pools[type].push({id:id, scene:s});
    });
    pools['all'] = Object.keys(D.escenas).map(function(id){return {id:id, scene:D.escenas[id]};});
    return pools;
  }

  function getRandomSceneOfType(type, exclude, depth){
    if(!game.scenePools) game.scenePools = buildScenePools();
    var candidates = (game.scenePools[type] || game.scenePools.all || []).filter(function(item){
      return exclude.indexOf(item.id) === -1 && item.id !== 'salida';
    });
    if(candidates.length === 0){
      candidates = (game.scenePools[type] || game.scenePools.all || []).filter(function(item){
        return item.id !== 'salida';
      });
    }
    if(candidates.length === 0) return null;
    return candidates[Math.floor(Math.random() * candidates.length)].id;
  }

  function randomizeSceneOptions(scene){
    var types = ['explore', 'combat', 'loot', 'rest'];
    var result = {_randomized:true, nombre:scene.nombre, desc:scene.desc, tipo:scene.tipo, opciones:[]};
    scene.opciones.forEach(function(opt){
      var r = Object.assign({}, opt);
      if(!/^random_/.test(r.resultado) && r.resultado !== 'salida'){
        // Replace with random destination of matching type if exists
        var type = scene.tipo || 'explore';
        if(Math.random() < 0.7){
          r.resultado = 'random_' + type;
        }
      }
      result.opciones.push(r);
    });
    return result;
  }

  function enterScene(sceneId, isRandom){
    var scene = D.escenas[sceneId];
    if(!scene){ narrate('No hay nada más que explorar aquí.', 'explore'); return; }
    game.scene = sceneId;
    if(game.visitedScenes.indexOf(sceneId) === -1) game.visitedScenes.push(sceneId);
    game.dungeonDepth = game.visitedScenes.length;
    if(isRandom || game.randomFlow){
      game.randomFlow = true;
      scene = randomizeSceneOptions(scene);
    }
    setLocation(scene.nombre);
    renderVisual(scene, sceneId);
    narrate(scene.desc, 'explore');
    // Random encounter check
    if(scene.encuentro && Math.random() < scene.encuentro.probabilidad){
      startCombat(scene.encuentro.monstruos);
      return;
    }
    renderActions(scene);
  }

  function renderActions(scene){
    const el = $('action-buttons');
    el.innerHTML = '';
    if(game.state === 'combat' && game.combat){
      renderCombatActions();
      return;
    }
    // Exploration actions
    const container = document.createElement('div');
    container.className = 'action-grid';
    scene.opciones.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'action-btn';
      btn.innerHTML = '<span class="action-icon">▶</span><span class="action-label">' + opt.texto + '</span>';
      btn.onclick = function(){ handleChoice(opt, scene); };
      container.appendChild(btn);
    });
    el.appendChild(container);
  }

  function handleChoice(opt, scene){
    // Check skill check
    if(opt.checks && opt.checks.habilidad && opt.checks.cd){
      const skillMap = {'Fuerza':'FUE','Destreza':'DES','Constitución':'CON','Inteligencia':'INT','Sabiduría':'SAB','Carisma':'CAR'};
      const abilKey = skillMap[opt.checks.habilidad] || 'DES';
      const roll = d20();
      const mod = game.player.mods[abilKey] || 0;
      const total = roll + mod;
      const success = total >= opt.checks.cd;
      if(success){
        narrate('(' + opt.checks.habilidad + ' ' + (roll+mod) + ' vs CD ' + opt.checks.cd + ') ' + opt.desc, 'explore');
        narrateRandom('exploracion_exito', 'explore');
      } else {
        narrate('(' + opt.checks.habilidad + ' ' + (roll+mod) + ' vs CD ' + opt.checks.cd + ') Fallaste. ' + (opt.checks.fallo || 'No logras nada.'), 'explore');
        narrateRandom('exploracion_fracaso', 'explore');
      }
    } else {
      narrate(opt.desc, 'explore');
    }
    // Resolve random scene destination
    var targetId = opt.resultado;
    var wasRandom = false;
    if(typeof targetId === 'string' && targetId.indexOf('random_') === 0){
      var type = targetId.replace('random_', '');
      var randomId = getRandomSceneOfType(type, game.visitedScenes, game.dungeonDepth);
      if(randomId){
        targetId = randomId;
        wasRandom = true;
        narrate('Te adentras en lo desconocido...', 'explore');
        narrateRandom('exploracion_exito', 'explore');
      } else {
        narrate('No encuentras nada nuevo por aquí.', 'explore');
        renderActions(scene);
        return;
      }
    }
    // Apply treasure
    if(targetId === scene.nombre.replace(/ /g,'_').toLowerCase()){
      // Same scene, just narrate
    }
    // Move to next scene
    if(D.escenas[targetId]){
      // Random event chance
      if(Math.random() < 0.15){
        narrateRandom('evento_aleatorio', 'explore');
      }
      // After depth 5+, occasionally force boss or exit
      if(game.dungeonDepth >= 5 && Math.random() < 0.25){
        narrate('Sientes que te acercas al final de este lugar...', 'explore');
        if(D.escenas['sala_trono']) targetId = 'sala_trono';
        else if(D.escenas['boveda_tesoro']) targetId = 'boveda_tesoro';
        else if(D.escenas['salida']) targetId = 'salida';
      }
      enterScene(targetId, wasRandom);
    } else if(targetId === scene.sceneId || !D.escenas[targetId]){
      // Stay in same scene
      renderActions(scene);
    }
  }

  // ---- Combat System ----
  function startCombat(monsterDefs){
    game.state = 'combat';
    game.combat = {
      enemies: [],
      initiative: [],
      round: 1
    };
    // Create enemy instances
    monsterDefs.forEach(def => {
      for(let i=0;i<def.cantidad;i++){
        const mData = getMonsterData(def.nombre);
        if(mData){
          game.combat.enemies.push({
            name: def.nombre,
            data: mData,
            hp: parseMonsterHP(mData.pg),
            maxHp: parseMonsterHP(mData.pg),
            ac: mData.ca,
            attackBonus: getMonsterAttackBonus(mData),
            damage: getMonsterDamage(mData),
            isDead: false
          });
        }
      }
    });
    // Roll initiative
    const initOrder = [];
    initOrder.push({name: game.player.name, type:'player', init: d20()+game.player.initiative, isDead:false});
    game.combat.enemies.forEach((e,i) => {
      initOrder.push({name: e.name, type:'enemy', index:i, init: d20()+getMod(e.data.des||10), isDead:false});
    });
    initOrder.sort((a,b) => b.init - a.init);
    game.combat.initiative = initOrder;
    game.turnIndex = 0;
    // Show combat UI
    $('combat-tracker').classList.remove('hidden');
    $('enemies-panel').classList.remove('hidden');
    narrateRandom('combate_inicio', 'combat');
    renderCombatTracker();
    renderEnemies();
    renderActions(null);
    updateStatusBar();
  }

  function renderCombatTracker(){
    const el = $('initiative-list');
    el.innerHTML = game.combat.initiative.map((entry, i) => {
      const isCurrent = i === game.turnIndex;
      const cls = entry.type === 'player' ? 'player' : '';
      const currentCls = isCurrent ? ' current' : '';
      let hpHtml = '';
      if(entry.type === 'enemy' && !entry.isDead){
        const enemy = game.combat.enemies[entry.index];
        hpHtml = '<span class="initiative-hp">[' + enemy.hp + '/' + enemy.maxHp + ']</span>';
      }
      return '<div class="initiative-entry' + cls + currentCls + '">' +
        '<span class="initiative-name">' + entry.name + '</span>' +
        hpHtml +
        '<span class="initiative-badge">' + entry.init + '</span>' +
        '</div>';
    }).join('');
  }

  function renderEnemies(){
    const el = $('enemies-list');
    el.innerHTML = game.combat.enemies.map(e => {
      const pct = (e.hp / e.maxHp) * 100;
      const deadCls = e.isDead ? ' dead' : '';
      return '<div class="enemy-card' + deadCls + '">' +
        '<div class="enemy-name">' + e.name + '</div>' +
        '<div class="enemy-stats">CA ' + e.ac + ' · PG ' + e.maxHp + '</div>' +
        '<div class="enemy-hp-bar"><div class="enemy-hp-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="enemy-hp-text">' + e.hp + '/' + e.maxHp + '</div>' +
        '</div>';
    }).join('');
  }

  function renderCombatActions(){
    const el = $('action-buttons');
    const container = document.createElement('div');
    container.className = 'action-grid';
    // Attack
    const attackBtn = document.createElement('button');
    attackBtn.className = 'action-btn primary';
    attackBtn.innerHTML = '<span class="action-icon">⚔️</span><span class="action-label">Atacar</span>';
    attackBtn.onclick = playerAttack;
    container.appendChild(attackBtn);
    // Defend
    const defendBtn = document.createElement('button');
    defendBtn.className = 'action-btn';
    defendBtn.innerHTML = '<span class="action-icon">🛡️</span><span class="action-label">Defender</span>';
    defendBtn.onclick = playerDefend;
    container.appendChild(defendBtn);
    // Use Item
    const itemBtn = document.createElement('button');
    itemBtn.className = 'action-btn';
    itemBtn.innerHTML = '<span class="action-icon">🧪</span><span class="action-label">Objeto</span>';
    itemBtn.onclick = playerUseItem;
    itemBtn.disabled = game.inventory.filter(i => i.type === 'potion').length === 0;
    container.appendChild(itemBtn);
    // Flee
    const fleeBtn = document.createElement('button');
    fleeBtn.className = 'action-btn danger';
    fleeBtn.innerHTML = '<span class="action-icon">🏃</span><span class="action-label">Huir</span>';
    fleeBtn.onclick = playerFlee;
    container.appendChild(fleeBtn);
    el.innerHTML = '';
    el.appendChild(container);
  }

  function playerAttack(){
    if(!game.combat) return;
    const roll = d20();
    const bonus = getAttackBonus();
    const total = roll + bonus;
    const isCrit = roll === 20;
    const target = game.combat.enemies.find(e => !e.isDead);
    if(!target){ narrate('No hay enemigos para atacar.', 'combat'); return; }
    if(isCrit){
      screenShake(3);
      hitFlash('crit');
      showDamageNumber('¡CRÍTICO!', 'crit', 50, 30);
      narrateRandom('combate_golpe_critico', 'combat');
    } else if(total >= target.ac){
      screenShake(2);
      hitFlash('damage');
      showDamageNumber('¡Golpe!', 'damage', 50, 35);
      narrateRandom('combate_golpe_acertado', 'combat');
    } else {
      narrateRandom('combate_golpe_fallido', 'combat');
      endPlayerTurn();
      return;
    }
    let damage = parseDice(getWeaponDamage(game.player.weapon));
    if(isCrit) damage *= 2;
    target.hp -= damage;
    narrate(' (' + total + ' vs CA ' + target.ac + ') Causaste ' + damage + ' puntos de daño.', 'combat');
    showDamageNumber('-' + damage, 'damage', 45 + Math.random()*10, 32);
    if(target.hp <= 0){
      target.isDead = true;
      narrateRandom('combate_muerte', 'combat');
      game.xp += parseInt(target.data.cr.replace('/','')) * 10 || 10;
      checkCombatEnd();
      return;
    }
    renderEnemies();
    renderCombatTracker();
    endPlayerTurn();
  }

  function playerDefend(){
    narrate('Te pones en posición defensiva. Tu armadura reluce bajo la luz tenue.', 'combat');
    game.player.actions.push({type:'defend', duration:1});
    endPlayerTurn();
  }

  function playerUseItem(){
    const potions = game.inventory.filter(i => i.type === 'potion');
    if(potions.length === 0){ narrate('No tienes pociones.', 'combat'); return; }
    const potion = potions[0];
    game.inventory = game.inventory.filter(i => i !== potion);
    const heal = parseDice('2d4+2');
    game.player.hp = Math.min(game.player.maxHp, game.player.hp + heal);
    hitFlash('heal');
    showDamageNumber('+' + heal, 'heal', 50, 35);
    narrate('Bebes la ' + potion.name + '. Recuperas ' + heal + ' puntos de golpe.', 'rest');
    updateStatusBar();
    endPlayerTurn();
  }

  function playerFlee(){
    const roll = d20();
    if(roll >= 10){
      narrate('Logras huir del combate. La criatura no te detiene.', 'explore');
      endCombat(false);
    } else {
      narrate('Intentas huir pero la criatura te alcanza. El combate continúa.', 'combat');
      endPlayerTurn();
    }
  }

  function endPlayerTurn(){
    // Enemy turn
    enemyTurn();
  }

  function enemyTurn(){
    const aliveEnemies = game.combat.enemies.filter(e => !e.isDead);
    if(aliveEnemies.length === 0){ checkCombatEnd(); return; }
    aliveEnemies.forEach(enemy => {
      if(game.player.hp <= 0){ checkCombatEnd(); return; }
      const roll = d20();
      const total = roll + enemy.attackBonus;
      if(total >= game.player.ac){
        const damage = parseDice(enemy.damage);
        game.player.hp -= damage;
        screenShake(2);
        hitFlash('damage');
        showDamageNumber('-' + damage, 'damage', 45 + Math.random()*10, 30);
        narrate('El ' + enemy.name + ' te ataca. (' + total + ' vs CA ' + game.player.ac + ') Recibes ' + damage + ' puntos de daño.', 'combat');
      } else {
        narrate('El ' + enemy.name + ' falla su ataque.', 'combat');
      }
    });
    renderCombatTracker();
    updateStatusBar();
    // Check if player died
    if(game.player.hp <= 0){
      narrate('Has caído en combate. Tus ojos se cierran sobre el mundo...', 'combat');
      gameOver();
      return;
    }
    // Advance turn
    game.turnIndex = (game.turnIndex + 1) % game.combat.initiative.length;
    // Skip dead enemies in initiative
    while(game.combat.initiative[game.turnIndex] && game.combat.initiative[game.turnIndex].type === 'enemy' && game.combat.enemies[game.combat.initiative[game.turnIndex].index].isDead){
      game.turnIndex = (game.turnIndex + 1) % game.combat.initiative.length;
    }
    renderCombatTracker();
  }

  function checkCombatEnd(){
    const alive = game.combat.enemies.filter(e => !e.isDead);
    if(alive.length === 0){
      narrateRandom('combate_victoria', 'combat');
      // Grant XP
      const xpGain = 20;
      game.xp += xpGain;
      narrate('Ganas ' + xpGain + ' puntos de experiencia.', 'explore');
      // Check for treasure
      const scene = D.escenas[game.scene];
      if(scene && scene.tesoro){
        const gold = parseInt(scene.tesoro.oro) || 0;
        game.gold += gold;
        narrate('Encuentras ' + scene.tesoro.oro + ' en el suelo.', 'loot');
        narrateRandom('tesoro_encontrado', 'loot');
        if(scene.tesoro.objetos){
          scene.tesoro.objetos.forEach(obj => {
            game.inventory.push({name: obj, type: 'treasure'});
            narrate('Añades "' + obj + '" a tu inventario.', 'loot');
          });
        }
      }
      endCombat(true);
    }
  }

  function endCombat(victory){
    game.state = 'explore';
    game.combat = null;
    $('combat-tracker').classList.add('hidden');
    $('enemies-panel').classList.add('hidden');
    if(victory){
      var goldReward = Math.floor(Math.random() * 20) + 5;
      game.gold += goldReward;
      var xpReward = Math.floor(Math.random() * 30) + 10;
      game.xp += xpReward;
      narrate('Obtienes ' + goldReward + ' mo y ' + xpReward + ' XP del botín.', 'loot');
      if(Math.random() < 0.3){
        var tables = ['menor','pociones','menor','armas_magicas'];
        var pick = D.tesoro[tables[Math.floor(Math.random() * tables.length)]];
        if(pick && pick.length > 0){
          var item = pick[Math.floor(Math.random() * pick.length)];
          game.inventory.push(item.nombre);
          narrate('¡Encuentras un objeto: ' + item.nombre + '! (' + (item.desc||'') + ')', 'loot');
        }
      }
      checkLevelUp();
    }
    updateStatusBar();
    // Return to scene
    const scene = D.escenas[game.scene];
    if(scene){
      renderActions(scene);
    }
  }

  function checkLevelUp(){
    var xpNeeded = game.player.level * 100;
    while(game.xp >= xpNeeded){
      game.xp -= xpNeeded;
      game.player.level++;
      game.player.maxHp += Math.floor(Math.random() * 6) + 2;
      game.player.hp = game.player.maxHp;
      narrate('¡Has subido al nivel ' + game.player.level + '! Tus heridas se cierran.', 'loot');
      narrateRandom('combate_victoria', 'combat');
      xpNeeded = game.player.level * 100;
    }
  }

  function gameOver(){
    game.state = 'game_over';
    game.combat = null;
    $('combat-tracker').classList.add('hidden');
    $('enemies-panel').classList.add('hidden');
    narrate('La aventura ha terminado. Tu leyenda quedará en el olvido.', 'rest');
    const el = $('action-buttons');
    el.innerHTML = '<div class="action-grid"><button class="action-btn danger" id="btn-restart" style="grid-column:1/-1"><span class="action-icon">🔄</span><span class="action-label">Reintentar</span></button></div>';
    $('btn-restart').onclick = function(){ goMenu(); };
  }

  function goMenu(){
    game.state = 'menu';
    game.scene = null;
    game.combat = null;
    game.narrator = [];
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    $('game-menu').classList.remove('hidden');
    $('game-view').classList.add('hidden');
    $('combat-tracker').classList.add('hidden');
    $('enemies-panel').classList.add('hidden');
    renderNarrator();
  }

  // ---- Event Listeners ----
  $('btn-new-game').addEventListener('click', startGame);
  $('btn-back-to-toolkit').addEventListener('click', goMenu);
  $('btn-load-game').addEventListener('click', function(){
    try {
      const data = localStorage.getItem('dnd_last_char');
      if(data){
        state.character = JSON.parse(data);
        startGame();
      } else { alert('No hay personaje guardado.'); }
    } catch(e){ alert('Error al cargar.'); }
  });
  $('btn-tts').addEventListener('click', function(){
    game.ttsEnabled = !game.ttsEnabled;
    this.textContent = game.ttsEnabled ? '🔊 Voz' : '🔇 Voz';
    if(!game.ttsEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
  });
  $('btn-tts-mode').addEventListener('click', function(){
    game.ttsMode = (game.ttsMode === 'web') ? 'local' : 'web';
    this.textContent = game.ttsMode === 'web' ? '🌐 Web' : '📱 Local';
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
  });
  $('btn-test-voice').addEventListener('click', function(){
    var testText = 'Bienvenido, aventurero. Que los dioses te guíen en tu travesía.';
    speakText(testText);
  });
  $('btn-debug-voices').addEventListener('click', function(){
    var voices = window.speechSynthesis.getVoices();
    if(!voices.length){
      alert('No hay voces disponibles todavía. Asegúrate de tener Google TTS instalado.');
      return;
    }
    var msg = 'Voces disponibles (' + voices.length + '):\n\n';
    voices.forEach(function(v){
      msg += '• ' + v.name + '\n  lang=' + v.lang + ' local=' + v.localService + '\n';
    });
    logVoiceDebug('Consulta manual de voces');
    alert(msg);
  });

  // Voice panel toggle
  $('btn-voice-panel').addEventListener('click', function(){
    var panel = $('voice-panel');
    var isHidden = panel.classList.contains('hidden');
    panel.classList.toggle('hidden');
    this.classList.toggle('active');
    if(isHidden) buildVoicePanel();
  });
  document.addEventListener('click', function(e){
    var panel = $('voice-panel');
    var btn = $('btn-voice-panel');
    if(!panel || !btn) return;
    if(!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target !== btn && !btn.contains(e.target)){
      panel.classList.add('hidden');
      btn.classList.remove('active');
    }
  });

  waitVoices(function(){ buildVoicePanel(); });

  // Update tab handler for game
  const origTabHandler = document.querySelectorAll('.tab-btn');
  origTabHandler.forEach(btn => {
    btn.addEventListener('click', function(){
      if(this.dataset.tab === 'jugar'){
        $('game-menu').classList.remove('hidden');
        $('game-view').classList.add('hidden');
        $('combat-tracker').classList.add('hidden');
        $('enemies-panel').classList.add('hidden');
        game.state = 'menu';
      }
    });
  });
})();

})();
</script>
</body>
</html>
